{% extends "base.html" %}
{% block title %}Login - BM Monitor{% endblock %}
{% block extra_css %}
<style>
    .login-wrap {
        min-height: calc(100vh - 120px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem 0 2rem;
    }

    .login-panel {
        width: 100%;
        max-width: 400px;
        animation: fadeUp 0.5s ease-out;
    }

    .login-hero {
        text-align: center;
        margin-bottom: 1.75rem;
    }

    .login-hero .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 1rem;
        border-radius: 16px;
        background: linear-gradient(145deg, var(--teal) 0%, #0e7490 100%);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 1.5rem;
        box-shadow: 0 8px 24px rgba(13, 148, 136, 0.3);
    }

    .login-hero h1 {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.65rem;
        letter-spacing: -0.03em;
        margin: 0 0 0.35rem;
    }

    .login-hero p {
        color: var(--muted);
        margin: 0;
        font-size: 0.95rem;
    }
</style>
{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="login-panel">
        <div class="login-hero">
            <div class="mark"><i class="bi bi-broadcast-pin"></i></div>
            <h1>BM Monitor</h1>
            <p>LAN network devices connection health</p>
        </div>
        <div class="form-panel">
            {% if form.errors %}
                <div class="alert alert-danger py-2 mb-3">Invalid username or password.</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" class="form-control" autofocus required autocomplete="username">
                </div>
                <div class="mb-4">
                    <label class="form-label" for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" class="form-control" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-app btn-app-primary w-100" style="padding:0.7rem;">
                    Login
                </button>
                <input type="hidden" name="next" value="{{ next }}">
            </form>
        </div>
    </div>
</div>
{% endblock %}
