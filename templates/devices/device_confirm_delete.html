{% extends "base.html" %}
{% block title %}Delete {{ device.name }} - BM Monitor{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="form-panel" style="border-color: rgba(225, 29, 72, 0.2);">
            <div style="width:48px;height:48px;border-radius:12px;background:var(--coral-soft);color:var(--coral);display:grid;place-items:center;font-size:1.35rem;margin-bottom:1rem;">
                <i class="bi bi-trash3"></i>
            </div>
            <h1 class="form-title">Remove device?</h1>
            <p class="mb-1" style="font-weight:600;">{{ device.name }}</p>
            <p class="text-muted mb-4">
                <span class="mono">{{ device.ip_address }}</span>
                {% if device.location %} · {{ device.location }}{% endif %}
                — this can’t be undone.
            </p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex flex-wrap gap-2">
                    <button type="submit" class="btn-app btn-app-danger">Yes, delete</button>
                    <a href="{% url 'dashboard' %}" class="btn-app btn-app-ghost">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
