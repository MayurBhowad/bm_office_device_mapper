{% extends "base.html" %}
{% block title %}Delete {{ device.name }} - LAN Monitor{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">
                <h5 class="mb-3">Remove "{{ device.name }}"?</h5>
                <p class="text-muted">{{ device.ip_address }} — this can't be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, delete</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
