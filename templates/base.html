<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}LAN Monitor{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background: #f4f6f9; }
        .navbar-brand { font-weight: 600; }
        .device-card { transition: box-shadow .15s ease, transform .15s ease; border-width: 2px; }
        .device-card:hover { box-shadow: 0 .5rem 1rem rgba(0,0,0,.1); transform: translateY(-2px); }
        .device-card.up { border-color: #198754; }
        .device-card.down { border-color: #dc3545; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .status-dot.up { background: #198754; box-shadow: 0 0 6px #198754; }
        .status-dot.down { background: #dc3545; }
        .mono { font-family: SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}"><i class="bi bi-hdd-network"></i> LAN Monitor</a>
        {% if user.is_authenticated %}
        <div class="d-flex align-items-center">
            <a href="{% url 'device_add' %}" class="btn btn-success btn-sm me-2"><i class="bi bi-plus-lg"></i> Add device</a>
            <span class="text-light small me-3">{{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
            </form>
        </div>
        {% endif %}
    </div>
</nav>
<div class="container pb-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
